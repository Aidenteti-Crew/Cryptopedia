      input:
        startUrls: ['https://x.com/Team1KOR']
        # The actor bills a minimum of 50 tweets per query on paid plans, so ask for all 50.
        maxItems: 50

  - url: 'https://x.com/AvaxTeam1'
    chain: 'avalanche'
    source_name: 'Avalanche Team1 X'
    source_type: 'TWITTER'
